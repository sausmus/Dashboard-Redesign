<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="redesign-favicon.svg">
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="shared/global-bell.css">
  <script src="shared/theme.js"></script>
  <style>
    .home-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 34px;
    }
    .home-date { margin-top: 9px; color: var(--td-text-secondary); font-size: 14px; }

    .now-section { margin-bottom: 30px; }
    .section-heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }
    .section-link {
      color: var(--td-accent-strong);
      text-decoration: none;
      font-size: 12px;
      font-weight: 720;
    }

    .now-card {
      position: relative;
      overflow: hidden;
      min-height: 315px;
      padding: clamp(24px, 4vw, 38px);
      background:
        radial-gradient(circle at 92% 12%, color-mix(in srgb, var(--td-lavender-soft) 70%, transparent) 0 12%, transparent 36%),
        radial-gradient(circle at 76% 110%, color-mix(in srgb, var(--td-accent-soft) 76%, transparent) 0 20%, transparent 48%),
        var(--td-surface);
    }
    .now-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }
    .now-kicker { display: flex; align-items: center; gap: 8px; color: var(--td-accent-strong); font-size: 11px; font-weight: 780; letter-spacing: .08em; text-transform: uppercase; }
    .now-kicker-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--td-accent); box-shadow: 0 0 0 5px rgba(var(--td-accent-rgb), .08); }
    .now-class { margin-top: 11px; font-size: clamp(24px, 3.2vw, 34px); font-weight: 760; letter-spacing: -.03em; }
    .now-class-subtitle { margin-top: 5px; color: var(--td-text-secondary); font-size: 13px; }
    .schedule-badge { flex: 0 0 auto; }

    .now-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid var(--td-border);
    }
    .now-action {
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 12px 14px;
      border: 1px solid var(--td-border);
      border-radius: 15px;
      background: color-mix(in srgb, var(--td-surface) 94%, transparent);
      text-decoration: none;
      transition: transform var(--td-fast), background var(--td-fast), border-color var(--td-fast);
    }
    .now-action:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--td-accent) 32%, var(--td-border)); background: var(--td-surface); }
    .now-action-icon { width: 40px; height: 40px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 12px; background: var(--td-accent-soft); color: var(--td-accent-strong); }
    .now-action:nth-child(1) .now-action-icon { background: var(--td-lavender-soft); color: var(--td-lavender); }
    .now-action-icon svg { width: 20px; height: 20px; stroke: currentColor; }
    .now-action strong { display: block; color: var(--td-text); font-size: 13px; }
    .now-action span { display: block; margin-top: 2px; color: var(--td-text-muted); font-size: 11px; }

    .today-card { overflow: hidden; }
    .today-list { list-style: none; padding: 0; margin: 0; }
    .today-item {
      display: grid;
      grid-template-columns: 78px 36px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      min-height: 66px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--td-border);
    }
    .today-item:last-child { border-bottom: 0; }
    .today-time { font-size: 12px; font-weight: 760; color: var(--td-text-secondary); font-variant-numeric: tabular-nums; }
    .today-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--td-warning-soft); color: var(--td-warning); }
    .today-icon.calendar { background: var(--td-accent-soft); color: var(--td-accent); }
    .today-copy { min-width: 0; }
    .today-title { font-size: 13px; font-weight: 720; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .today-meta { margin-top: 3px; color: var(--td-text-muted); font-size: 11px; }
    .today-empty { padding: 25px 20px; color: var(--td-text-secondary); font-size: 13px; }
    .calendar-placeholder .today-title { color: var(--td-text); }
    .today-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      border-top: 1px solid var(--td-border);
      background: var(--td-surface-soft);
    }
    .today-source-note { color: var(--td-text-muted); font-size: 11px; }

    @media (max-width: 760px) {
      .home-head { margin-bottom: 26px; }
      .now-actions { grid-template-columns: 1fr; }
      .today-item { grid-template-columns: 68px 34px minmax(0, 1fr); padding-inline: 14px; gap: 9px; }
      .now-card { min-height: 0; }
    }

    .today-connect { color:var(--td-text-secondary); }
    .today-connect a { color:var(--td-accent-strong); font-weight:700; text-decoration:none; }
    .today-footer .td-link-button { border:0; padding:0; background:transparent; color:var(--td-accent-strong); font:inherit; font-size:11px; font-weight:750; cursor:pointer; }

  </style>
</head>
<body>
  <div class="td-mobile-placeholder" data-td-mobile-bar></div>
  <div class="td-shell">
    <div data-td-sidebar="home"></div>

    <main class="td-main">
      <div class="td-content">
        <header class="home-head">
          <div>
            <h1 id="greeting" class="td-page-title">Good morning, Shaun</h1>
            <div id="todayDate" class="home-date"></div>
          </div>
        </header>

        <section class="now-section" aria-labelledby="nowHeading">
          <div class="section-heading-row">
            <div id="nowHeading" class="td-eyebrow">Now</div>
            <a class="section-link" href="bell-countdown.html">Full countdown →</a>
          </div>

          <article class="td-card now-card">
            <div class="now-top">
              <div>
                <div id="nowKicker" class="now-kicker"><span class="now-kicker-dot"></span><span>Current class</span></div>
                <div id="nowClass" class="now-class">Loading schedule…</div>
                <div id="nowClassSubtitle" class="now-class-subtitle"></div>
              </div>
              <div id="scheduleBadge" class="td-badge schedule-badge"><span class="td-dot"></span><span>Schedule</span></div>
            </div>


            <div class="now-actions" aria-label="Current class shortcuts">
              <a class="now-action" id="agendaShortcut" href="agenda.html">
                <span class="now-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M8 2.5v4M16 2.5v4M3 9h18"/><path d="M7.5 13h3M7.5 16.5h6"/></svg></span>
                <span><strong>Agenda</strong><span id="agendaShortcutCopy">Open today's lesson plan</span></span>
              </a>
              <a class="now-action" id="studentsShortcut" href="students.html">
                <span class="now-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.5-3.2 2.4-5 5.5-5s5 1.8 5.5 5"/><circle cx="17.5" cy="9.5" r="2.2"/><path d="M15.5 15.5c2.8-.4 4.6.7 5 3.5"/></svg></span>
                <span><strong>Students</strong><span>Roster, Student Selector, participation & timeliness</span></span>
              </a>
            </div>
          </article>
        </section>

        <section aria-labelledby="todayHeading">
          <div class="section-heading-row">
            <div id="todayHeading" class="td-eyebrow">Today</div>
          </div>
          <article class="td-card today-card">
            <ul id="todayList" class="today-list"></ul>
            <div class="today-footer">
              <span id="todaySourceNote" class="today-source-note">Dashboard reminders</span>
              <button id="viewDayButton" class="td-link-button" type="button">View day →</button>
            </div>
          </article>
        </section>
      </div>
    </main>
  </div>

  <script src="shared/app-shell.js"></script>
  <script src="shared/dashboard-data.js"></script>
  <script src="shared/class-groups.js"></script>
  <script src="shared/agenda-service.js"></script>
  <script src="shared/calendar-service.js"></script>
  <script src="shared/bell-service.js"></script><script src="shared/global-bell.js"></script>
  <script src="shared/reminder-service.js"></script>
  <script>
    (() => {
      const el = id => document.getElementById(id);
      let calendarEvents = [];
      let calendarState = "disconnected";
      let calendarError = "";
      let todayExpanded = false;

      function updateGreeting() {
        const now = new Date();
        const hour = now.getHours();
        const greeting = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
        el("greeting").textContent = `${greeting}, Shaun`;
        el("todayDate").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
      }

      function activeClassLabel(snapshot) {
        const automaticId = window.BellService?.getAutomaticClassId?.();
        const classInfo = automaticId ? window.DashboardData?.getClass?.(automaticId) : null;
        const entryName = snapshot?.entry?.name || "";
        if (classInfo?.name && classInfo.name !== entryName) return `${entryName} · ${classInfo.name}`;
        return classInfo?.name || entryName || "School day";
      }

      function renderNow() {
        if (!window.BellService) return;
        const s = BellService.getSnapshot();
        const scheduleLabel = s.scheduleLabel || "Schedule";
        el("scheduleBadge").innerHTML = `<span class="td-dot"></span><span>${scheduleLabel}</span>`;

        let kicker = "Current class";
        let title = activeClassLabel(s);
        let subtitle = "";

        if (s.phase === "passing") {
          kicker = "Passing period";
          title = s.nextEntry?.name ? `Up next: ${s.nextEntry.name}` : "Passing period";
        } else if (s.countdownType === "schoolStart") {
          kicker = s.phase === "afterSchool" ? "Planning" : "Before school";
          title = s.phase === "afterSchool" ? (s.targetDayLabel ? `${s.targetDayLabel} planning` : "Next school day") : (s.targetDayLabel ? `${s.targetDayLabel} · First Bell` : "First Bell");
        } else if (s.entry?.name && !/^Period\s+\d+$/i.test(s.entry.name)) {
          kicker = s.entry.name;
          title = s.entry.name;
        } else if (s.entry?.name) {
          const classId = String(s.entry.name.match(/\d+/)?.[0] || "");
          const info = classId ? DashboardData.getClass(classId) : null;
          subtitle = info?.name && info.name !== s.entry.name ? info.name : "";
        }

        const currentClass = BellService.getAutomaticClassId?.() || DashboardData.getCurrentClassId?.();
        if (currentClass) {
          const group = ClassGroups.getGroupForClass(currentClass);
          const context = AgendaService.getContext(new Date(), currentClass);
          const contextParts = [];
          if (group) contextParts.push(group.name);
          if (context.isException) contextParts.push("one-day Agenda exception");
          else if (context.scope === "all") contextParts.push("shared Agenda: all classes");
          else if (context.scope.startsWith("group:") && context.group) contextParts.push(`shared Agenda: ${context.group.name}`);
          if (contextParts.length && !subtitle.includes(contextParts[0])) subtitle = [subtitle, ...contextParts].filter(Boolean).join(" · ");
          el("agendaShortcut").href = `agenda.html?period=${encodeURIComponent(currentClass)}`;
          el("agendaShortcutCopy").textContent = context.scope.startsWith("group:") && context.group ? `Open ${context.group.name} lesson plan` : (context.isException ? "Open this class's exception agenda" : "Open today's lesson plan");
          el("studentsShortcut").href = `students.html?period=${encodeURIComponent(currentClass)}`;
        } else {
          el("agendaShortcut").href = "agenda.html";
          el("agendaShortcutCopy").textContent = "Plan upcoming lessons";
          el("studentsShortcut").href = "students.html";
        }

        el("nowKicker").innerHTML = `<span class="now-kicker-dot"></span><span>${kicker}</span>`;
        el("nowClass").textContent = title;
        el("nowClassSubtitle").textContent = subtitle;
      }

      function reminderTime(reminder) {
        const ts = Number(reminder.snoozeUntil || reminder.triggerAt || 0);
        if (!ts) return "—";
        return new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      }

      function eventTime(event) {
        if (event?.start?.date && !event?.start?.dateTime) return "All day";
        const value = event?.start?.dateTime || event?.start?.date;
        if (!value) return "—";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? "—" : date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      }

      function eventTimestamp(event) {
        if (event?.start?.date && !event?.start?.dateTime) {
          const [y, m, d] = String(event.start.date).split("-").map(Number);
          return new Date(y, (m || 1) - 1, d || 1, 0, 0, 0, 0).getTime() - 1;
        }
        return new Date(event?.start?.dateTime || event?.start?.date || 0).getTime() || 0;
      }

      function buildTodayRows() {
        const todayKey = ReminderService.dateKey();
        const reminders = ReminderService.getReminders()
          .filter(item => item.date === todayKey && !["done", "missed"].includes(item.status))
          .map(item => ({ type: "reminder", timestamp: Number(item.snoozeUntil || item.triggerAt || 0), item }));
        const events = calendarEvents
          .filter(event => event?.status !== "cancelled")
          .map(item => ({ type: "calendar", timestamp: eventTimestamp(item), item }));
        return [...reminders, ...events].sort((a, b) => a.timestamp - b.timestamp);
      }

      function renderToday() {
        const list = el("todayList");
        if (!window.ReminderService) {
          list.innerHTML = '<li class="today-empty">Today’s feed is loading…</li>';
          return;
        }

        const allRows = buildTodayRows();
        const limit = todayExpanded ? allRows.length : 5;
        const rows = allRows.slice(0, limit).map(row => {
          if (row.type === "reminder") {
            const item = row.item;
            return `<li class="today-item"><div class="today-time">${escapeHtml(reminderTime(item))}</div><div class="today-icon" aria-hidden="true">♢</div><div class="today-copy"><div class="today-title">${escapeHtml(item.text || "Class reminder")}</div><div class="today-meta">${escapeHtml(item.studentName ? `${item.studentName} · ${item.className || "Reminder"}` : (item.className || item.triggerLabel || "Dashboard reminder"))}</div></div></li>`;
          }
          const event = row.item;
          const location = String(event.location || "").trim();
          return `<li class="today-item"><div class="today-time">${escapeHtml(eventTime(event))}</div><div class="today-icon calendar" aria-hidden="true">□</div><div class="today-copy"><div class="today-title">${escapeHtml(event.summary || "Calendar event")}</div><div class="today-meta">${escapeHtml(location || (event.start?.date && !event.start?.dateTime ? "Google Calendar · all day" : "Google Calendar"))}</div></div></li>`;
        });

        if (!rows.length && calendarState === "loading") {
          rows.push('<li class="today-empty">Loading Calendar and reminders…</li>');
        } else if (!rows.length && calendarState === "disconnected") {
          rows.push('<li class="today-item today-connect"><div class="today-time">Calendar</div><div class="today-icon calendar" aria-hidden="true">□</div><div class="today-copy"><div class="today-title">Connect Google Calendar</div><div class="today-meta"><a href="settings.html#calendarPanel">Open Settings</a> to add calendar events to Today.</div></div></li>');
        } else if (!rows.length && calendarState === "reconnect") {
          rows.push('<li class="today-item today-connect"><div class="today-time">Calendar</div><div class="today-icon calendar" aria-hidden="true">□</div><div class="today-copy"><div class="today-title">Reconnect Google Calendar</div><div class="today-meta">Your previous permission is saved, but this browser session needs fresh Calendar access. <button id="todayCalendarReconnect" class="td-link-button" type="button">Reconnect →</button></div></div></li>');
        } else if (!rows.length && calendarState === "error") {
          rows.push(`<li class="today-item today-connect"><div class="today-time">Calendar</div><div class="today-icon calendar" aria-hidden="true">□</div><div class="today-copy"><div class="today-title">Calendar needs attention</div><div class="today-meta">${escapeHtml(calendarError || "Calendar events could not be loaded.")} <a href="settings.html#calendarPanel">Open Settings</a></div></div></li>`);
        } else if (!rows.length) {
          rows.push('<li class="today-empty">Nothing else is scheduled today.</li>');
        }

        list.innerHTML = rows.join("");
        const reconnectButton = el("todayCalendarReconnect");
        if (reconnectButton) reconnectButton.addEventListener("click", reconnectCalendarFromHome);
        const sourceParts = ["Reminders"];
        if (calendarState === "ready") sourceParts.push("Google Calendar");
        else if (calendarState === "reconnect") sourceParts.push("Calendar needs reconnect");
        else if (calendarState === "loading") sourceParts.push("Calendar loading");
        el("todaySourceNote").textContent = sourceParts.join(" + ");
        el("viewDayButton").hidden = allRows.length <= 5;
        el("viewDayButton").textContent = todayExpanded ? "Show less ↑" : "View day →";
      }

      async function refreshCalendar() {
        if (!window.CalendarService || !CalendarService.getClientId()) {
          calendarState = "disconnected";
          calendarEvents = [];
          renderToday();
          return;
        }
        if (!CalendarService.hasConsentHint()) {
          calendarState = "disconnected";
          calendarEvents = [];
          renderToday();
          return;
        }
        if (!CalendarService.isConnected()) {
          calendarState = "reconnect";
          calendarEvents = [];
          calendarError = "";
          renderToday();
          return;
        }
        calendarState = "loading";
        renderToday();
        try {
          calendarEvents = await CalendarService.listEventsForDay(new Date());
          calendarState = "ready";
          calendarError = "";
        } catch (error) {
          console.error(error);
          calendarEvents = [];
          calendarState = "error";
          calendarError = error?.message || "Reconnect Google Calendar in Settings.";
        }
        renderToday();
      }

      async function reconnectCalendarFromHome() {
        calendarState = "loading";
        calendarError = "";
        renderToday();
        try {
          await CalendarService.connect({ force: true, silent: true });
          calendarEvents = await CalendarService.listEventsForDay(new Date());
          calendarState = "ready";
        } catch (error) {
          console.error(error);
          calendarEvents = [];
          calendarState = "error";
          calendarError = error?.message || "Google Calendar could not be reconnected.";
        }
        renderToday();
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>'"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[ch]));
      }

      updateGreeting();
      renderNow();
      renderToday();
      refreshCalendar();
      setInterval(renderNow, 1000);
      setInterval(renderToday, 30000);
      setInterval(refreshCalendar, 5 * 60 * 1000);
      window.addEventListener(BellService?.changeEvent || "teacher-dashboard-bell-changed", renderNow);
      window.addEventListener(ReminderService?.changeEvent || "teacher-dashboard-reminders-changed", renderToday);
      window.addEventListener(ClassGroups?.changeEvent || "teacher-dashboard-class-groups-changed", renderNow);
      window.addEventListener(AgendaService?.changeEvent || "teacher-dashboard-agenda-changed", renderNow);
      window.addEventListener(CalendarService?.changeEvent || "teacher-dashboard-google-calendar-changed", () => { if (CalendarService.isConnected()) refreshCalendar(); else renderToday(); });
      el("viewDayButton").addEventListener("click", () => { todayExpanded = !todayExpanded; renderToday(); });
    })();
  </script>
</body>
</html>
